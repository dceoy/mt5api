---
name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-release-${{ github.repository }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  prepare:
    if: >-
      github.repository == 'dceoy/mt5api'
      && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: dceoy/gha-for-devops/.github/workflows/python-package-release-prepare.yml@607489fde554da8b89bacf055479d3723e529e2a  # v2.3.2
    with:
      package-path: .
  publish-to-pypi:
    needs: prepare
    if: needs.prepare.outputs.release-tag != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.prepare.outputs.project-name }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.distribution-artifact-name }}
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          verbose: true
  publish-release:
    needs:
      - prepare
      - publish-to-pypi
    if: needs.prepare.outputs.release-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
        run: |
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
