---
name: Refresh lockfile
on:
  push:
    branches:
      - agent/resolve-packaging-issue-50
permissions:
  contents: write
jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: python -m pip install uv
      - name: Refresh lockfile and remove temporary workflow
        run: |
          uv lock
          rm .github/workflows/refresh-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/refresh-lock.yml
          git diff --cached --quiet || git commit -m "Refresh lockfile"
          git push
