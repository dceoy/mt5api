name: Refresh branch lockfile

on:
  push:
    branches:
      - agent/cleanup-and-python-314

permissions:
  contents: write
  actions: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Regenerate lockfile and re-run CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git clone --quiet "https://x-access-token:$env:GH_TOKEN@github.com/$env:REPOSITORY.git" repo
          Set-Location repo
          git checkout --quiet $env:BRANCH
          uv lock
          Remove-Item .github/workflows/agent-refresh-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/agent-refresh-lock.yml
          if (-not (git diff --cached --quiet)) {
            git commit -m "Refresh lockfile for Python 3.14"
            git push origin "HEAD:$env:BRANCH"
          }
          gh api --method POST "repos/$env:REPOSITORY/actions/workflows/ci.yml/dispatches" -f ref="$env:BRANCH" -f 'inputs[workflow]=lint-and-test'
