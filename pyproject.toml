[project]
name = "pdmt5-api"
version = "0.1.0"
description = "MetaTrader 5 REST API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "pdmt5-api contributors" }
]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn[standard]>=0.27",
  "pdmt5",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "pytest>=7.0.0",
  "ruff>=0.3.0",
]

[project.scripts]
pdmt5-api = "pdmt5_api.cli:main"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
