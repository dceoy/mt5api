[project]
name = "mt5api"
version = "1.0.3"
description = "MetaTrader 5 REST API"
authors = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
maintainers = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">= 3.11, < 3.15"
dependencies = [
  "pdmt5 >= 1.2.0",
  "fastapi >= 0.115.0",
  "uvicorn[standard] >= 0.32.0",
  "pandas >= 3.0.3",
  "pydantic >= 2.13.4",
  "pyarrow >= 18.0.0",
  "python-multipart >= 0.0.31",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Repository = "https://github.com/dceoy/mt5api.git"

[tool.uv]
required-environments = ["platform_system == 'Windows'"]
exclude-newer = "1 week"
exclude-newer-package = { pdmt5 = false }

[dependency-groups]
dev = [
  "httpx >= 0.27.0",
  "httpx2 >= 2.0.0",
  "ruff >= 0.11.0",
  "pyright >= 1.1.407",
  "pytest >= 8.0.0",
  "pytest-asyncio >= 0.25.2",
  "pytest-mock >= 3.12.0",
  "pytest-cov >= 5.0.0",
  "pandas-stubs >= 3.0.3.260530",
  "types-pygments >= 2.19.0.20250516",
  "types-colorama >= 0.4.15.20240311",
  "types-pexpect >= 4.9.0.20250516",
  "mkdocs >= 1.6.1",
  "mkdocs-material >= 9.6.15",
  "mkdocstrings[python] >= 0.29.1",
]

[tool.hatch.build.targets.wheel]
packages = ["mt5api"]

[tool.ruff]
line-length = 88
exclude = ["build", ".venv"]
preview = true

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "D",
  "UP",
  "S",
  "B",
  "C4",
  "SIM",
  "ARG",
  "PD",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "FLY",
  "NPY",
  "PERF",
  "FURB",
  "RUF",
  "YTT",
  "ANN",
  "ASYNC",
  "BLE",
  "FBT",
  "A",
  "COM",
  # "CPY",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  "ISC",
  "ICN",
  "LOG",
  "G",
  "INP",
  "PIE",
  "T20",
  "PYI",
  "PT",
  "Q",
  "RSE",
  # "RET",
  "SLF",
  "SLOT",
  "TID",
  "TCH",
  "INT",
  "PTH",
  "TD",
  "FIX",
  "ERA",
  "PGH",
  "TRY",
  "FAST",
  "AIR",
  "DOC",
]
ignore = [
  "COM812",
  "FBT001",
  "FBT002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "DOC201",
  "DOC501",
  "PLC2701",
  "PLR0904",
  "PLR2004",
  "PLR6301",
  "S101",
  "S106",
  "SLF001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-public-methods = 40

[tool.pyright]
exclude = ["build", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = [
  "--cov=mt5api",
  "--cov-branch",
  "--doctest-modules",
  "--capture=no",
]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "6.0"

[tool.coverage.run]
source = ["mt5api"]
omit = [
  "**/__init__.py",
  "tests/**",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["if TYPE_CHECKING:"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
